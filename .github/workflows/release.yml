name: Build binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS binary
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          GOOS=darwin GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.version=${VERSION}" \
            -o mirador-darwin-${{ matrix.goarch }} .

      - name: Upload macOS release asset
        uses: softprops/action-gh-release@v2
        with:
          files: mirador-darwin-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build Linux binary
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=1 go build \
            -ldflags "-X main.version=${VERSION}" \
            -o mirador-linux-${{ matrix.goarch }} .

      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          files: mirador-linux-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
